<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Plan</title><style>
:root{--ink:#172033;--mute:#71809a;--line:#e5eaf1;--blue:#2563eb;--soft:#eff6ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#edf4ff,#f7f8fc 330px);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.app{max-width:820px;margin:auto;padding:24px 16px 50px}header,.head{display:flex;align-items:center;justify-content:space-between;gap:9px}h1{margin:0;font-size:31px;letter-spacing:-.05em}h2{margin:0;font-size:18px}.sub,.meta{color:var(--mute);font-size:13px;margin-top:4px}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:10px 13px;font-weight:750;cursor:pointer}.primary{background:linear-gradient(135deg,#2563eb,#4f46e5);color:white}.ghost{background:#eef2f7;color:#4d5b70}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 25px #1720330a}.nav{display:flex;gap:5px;background:#e8edf5;padding:4px;border-radius:15px;margin:15px 0;overflow:auto}.nav button{white-space:nowrap;background:transparent;color:#59677e}.nav .active{background:#fff;color:#1d4ed8;box-shadow:0 2px 8px #17203316}.view{display:none}.view.active{display:block}.quick{display:grid;grid-template-columns:1fr auto;gap:8px}input,select{width:100%;padding:11px;border:1px solid #d9e2ed;border-radius:12px;background:#fff}.focus{background:linear-gradient(135deg,#eaf3ff,#f4f0ff);border-color:#d4e4ff}.focus b{font-size:21px;display:block;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:11px;background:#f8faff;border:1px solid #e5edf8;border-radius:15px}.stat b{display:block;font-size:22px;color:#1d4ed8}.stat span{font-size:12px;color:var(--mute);font-weight:700}.task,.item{display:flex;gap:11px;align-items:flex-start;padding:12px 1px;border-bottom:1px solid #edf0f5}.task:last-child,.item:last-child{border:0}.check{width:22px;height:22px;flex:none;border:2px solid #bdc9d8;border-radius:50%;background:#fff;padding:0}.done{opacity:.48;text-decoration:line-through}.done .check{background:var(--blue);border-color:var(--blue);color:#fff}.body{flex:1}.name{font-weight:800}.meta{line-height:1.55}.badge{font-size:11px;font-weight:800;padding:3px 7px;border-radius:99px;background:#fef3c7;color:#92400e}.A{background:#fee2e2;color:#b91c1c}.C{background:#dcfce7;color:#166534}.empty{text-align:center;color:var(--mute);padding:22px}.shop-add{display:grid;grid-template-columns:1fr 95px 130px auto;gap:8px;margin-top:12px}.group{margin-top:18px}.group h3{font-size:13px;color:#58657c;margin:0 0 6px}.item small{display:block;color:var(--mute);margin-top:3px}.item button:last-child{padding:6px 9px;color:#657288}.plan{background:linear-gradient(135deg,#eaf3ff,#f4f0ff);border-color:#d4e4ff}.filter{display:flex;gap:6px;margin:12px 0;overflow:auto}.filter button{white-space:nowrap;background:#fff;color:#56647c;border:1px solid var(--line);padding:7px 10px}.filter .active{background:var(--soft);color:#1d4ed8}@media(max-width:560px){.quick,.shop-add{grid-template-columns:1fr 1fr}.quick button,.shop-add button{grid-column:span 2}.stats{gap:5px}.card{padding:14px}}
</style></head><body><main class="app"><header><div><h1>Mein Plan</h1><div class="sub" id="date"></div></div><button class="primary" onclick="addTask()">＋ Aufgabe</button></header><nav class="nav"><button class="active" onclick="show('today',this)">Heute</button><button onclick="show('tasks',this)">Aufgaben</button><button onclick="show('shop',this)">Einkaufen</button></nav>
<section id="today" class="view active"><div class="quick"><input id="newTask" placeholder="Was möchtest du erledigen?" onkeydown="if(event.key==='Enter')addTask()"><button class="primary" onclick="addTask()">Hinzufügen</button></div><div class="card focus" id="focus"></div><div class="stats"><div class="stat"><b id="open">0</b><span>offen</span></div><div class="stat"><b id="todayCount">0</b><span>für heute</span></div><div class="stat"><b id="shoppingCount">0</b><span>Artikel offen</span></div></div><div class="card"><div class="head"><h2>Heute geplant</h2><button class="ghost" onclick="show('tasks',document.querySelectorAll('.nav button')[1])">Planen</button></div><div id="todayList"></div></div></section>
<section id="tasks" class="view"><div class="filter"><button class="active" onclick="setFilter('open',this)">Offen</button><button onclick="setFilter('all',this)">Alle</button><button onclick="setFilter('today',this)">Heute</button><button onclick="setFilter('done',this)">Erledigt</button></div><div class="card"><div class="head"><h2>Aufgaben</h2><select id="sort" onchange="render()"><option value="smart">Priorität & Frist</option><option value="date">Planung</option><option value="duration">Dauer</option></select></div><div id="taskList"></div></div></section>
<section id="shop" class="view"><div class="card plan"><div class="head"><div><h2>Einkauf planen</h2><div class="sub" id="shopPlan"></div></div><input id="shopDate" type="date" style="width:auto" onchange="saveShopDate()"></div><div class="shop-add"><input id="product" placeholder="z. B. Milch" onkeydown="if(event.key==='Enter')addProduct()"><input id="qty" placeholder="Menge"><select id="cat"><option>Obst & Gemüse</option><option>Kühlschrank</option><option>Vorrat</option><option>Haushalt</option><option>Drogerie</option><option>Sonstiges</option></select><button class="primary" onclick="addProduct()">Zur Liste</button></div></div><div class="card"><div class="head"><h2>Deine Einkaufsliste</h2><button class="ghost" onclick="clearDone()">Erledigte löschen</button></div><div id="shopList"></div></div></section></main>
<script>
const TASK_KEY='mein-aufgabenplaner-v1',SHOP_KEY='mein-einkaufslisten-v1',DATE_KEY='mein-einkaufstermin-v1';let filter='open';
function load(k){try{let x=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}let tasks=load(TASK_KEY),products=load(SHOP_KEY);function save(){localStorage.setItem(TASK_KEY,JSON.stringify(tasks));localStorage.setItem(SHOP_KEY,JSON.stringify(products));render()}function day(){let d=new Date();d.setHours(0,0,0,0);return d}function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function show(id,b){document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active')});document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');render()}function addTask(){let input=document.getElementById('newTask'),title=input.value.trim()||prompt('Neue Aufgabe:');if(!title)return;tasks.push({id:String(Date.now()+Math.random()),title:title,priority:'B',duration:30,planned:'',due:'',done:false});input.value='';save()}function toggleTask(id){let x=tasks.find(function(t){return t.id===id});if(x){x.done=!x.done;save()}}function taskRow(t){let meta=(t.duration||0)+' Min.'+(t.planned?' · geplant '+t.planned:'')+(t.due?' · Frist '+t.due:'');return '<div class="task '+(t.done?'done':'')+'"><button class="check" onclick="toggleTask(\''+t.id+'\')">'+(t.done?'✓':'')+'</button><div class="body"><div class="name">'+esc(t.title)+'</div><div class="meta"><span class="badge '+t.priority+'">'+t.priority+'</span> '+meta+'</div></div></div>'}
function addProduct(){let name=document.getElementById('product').value.trim();if(!name)return;products.push({id:String(Date.now()+Math.random()),name:name,qty:document.getElementById('qty').value.trim(),cat:document.getElementById('cat').value,done:false});document.getElementById('product').value='';document.getElementById('qty').value='';save()}function toggleProduct(id){let x=products.find(function(p){return p.id===id});if(x){x.done=!x.done;save()}}function removeProduct(id){products=products.filter(function(p){return p.id!==id});save()}function clearDone(){products=products.filter(function(p){return!p.done});save()}function saveShopDate(){localStorage.setItem(DATE_KEY,document.getElementById('shopDate').value);render()}
function setFilter(x,b){filter=x;document.querySelectorAll('.filter button').forEach(function(q){q.classList.remove('active')});b.classList.add('active');render()}function sort(a,b){let m=document.getElementById('sort').value;if(m==='duration')return(+a.duration||0)-(+b.duration||0);if(m==='date')return(a.planned||'9999').localeCompare(b.planned||'9999');return({A:0,B:1,C:2}[a.priority]||1)-({A:0,B:1,C:2}[b.priority]||1)||(a.due||'9999').localeCompare(b.due||'9999')}
function render(){let now=iso(day()),open=tasks.filter(function(t){return!t.done}),tod=open.filter(function(t){return t.planned===now}),next=open.slice().sort(sort)[0];document.getElementById('date').textContent=day().toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long'});document.getElementById('open').textContent=open.length;document.getElementById('todayCount').textContent=tod.length;document.getElementById('shoppingCount').textContent=products.filter(function(p){return!p.done}).length;document.getElementById('focus').innerHTML=next?'<div class="sub">DEIN NÄCHSTER FOKUS</div><b>'+esc(next.title)+'</b><div class="meta">'+(next.duration||0)+' Min. · Priorität '+next.priority+'</div>':'<b>Alles erledigt – gut gemacht.</b><div class="sub">Plane etwas Neues oder genieße den freien Kopf.</div>';document.getElementById('todayList').innerHTML=tod.length?tod.map(taskRow).join(''):'<div class="empty">Noch nichts für heute eingeplant.</div>';let list=tasks.filter(function(t){return filter==='open'?!t.done:filter==='today'?!t.done&&t.planned===now:filter==='done'?t.done:true}).sort(sort);document.getElementById('taskList').innerHTML=list.length?list.map(taskRow).join(''):'<div class="empty">Keine passenden Aufgaben.</div>';let d=localStorage.getItem(DATE_KEY)||'';document.getElementById('shopDate').value=d;document.getElementById('shopPlan').textContent=d?'Nächster Einkauf: '+d:'Lege einen Termin für deinen nächsten Einkauf fest.';let groups={};products.forEach(function(p){(groups[p.cat]||(groups[p.cat]=[])).push(p)});let html=Object.keys(groups).map(function(c){return '<div class="group"><h3>'+esc(c)+'</h3>'+groups[c].map(function(p){return '<div class="item '+(p.done?'done':'')+'"><button class="check" onclick="toggleProduct(\''+p.id+'\')">'+(p.done?'✓':'')+'</button><div class="body"><b>'+esc(p.name)+'</b>'+(p.qty?'<small>'+esc(p.qty)+'</small>':'')+'</div><button onclick="removeProduct(\''+p.id+'\')">×</button></div>'}).join('')+'</div>'}).join('');document.getElementById('shopList').innerHTML=html||'<div class="empty">Deine Liste ist leer. Füge oben deinen ersten Artikel hinzu.</div>'}render();
</script><script>
function addTask(){let input=document.getElementById('newTask'),title=input.value.trim()||prompt('Neue Aufgabe:');if(!title)return;let forToday=confirm('Möchtest du diese Aufgabe für heute einplanen?');tasks.push({id:String(Date.now()+Math.random()),title:title,priority:'B',duration:30,planned:forToday?iso(day()):'',due:'',done:false});input.value='';save()}
</script></body></html>
