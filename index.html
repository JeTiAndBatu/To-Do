<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Mein Aufgabenplaner</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}.app{max-width:720px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:29px;margin:0}h2{font-size:19px;margin:0 0 12px}.sub{color:var(--muted);font-size:14px;margin-top:3px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;background:#111827;color:#fff}button.secondary{background:#eef0f3;color:#111827}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000008}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8f9fa;border-radius:14px;padding:12px}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tab{white-space:nowrap;background:#fff;color:#374151;border:1px solid var(--line)}.tab.active{background:#111827;color:#fff}.task{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);touch-action:pan-y}.task:last-child{border-bottom:0}.check{width:22px;height:22px;border:2px solid #cbd0d8;border-radius:50%;padding:0;background:#fff;flex:none}.done .check{background:#111827;border-color:#111827;color:#fff}.done .title{text-decoration:line-through;color:#9ca3af}.title{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:5px}.pill{display:inline-block;padding:3px 7px;border-radius:8px;font-size:11px;font-weight:800;margin-right:5px}.A{background:#fee2e2;color:#b91c1c}.B{background:#fef3c7;color:#92400e}.C{background:#dcfce7;color:#166534}.actions{margin-left:auto}.icon{background:#f3f4f6;color:#374151;padding:7px 9px}input,select{width:100%;padding:12px;border:1px solid #d7dbe1;border-radius:11px;font-size:15px;background:#fff}label{display:block;font-size:12px;font-weight:700;color:#4b5563;margin:10px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;color:var(--muted);padding:25px 10px}.row{display:flex;gap:8px;margin-top:14px}.row>*{flex:1}
.deadline{margin-top:12px;padding:13px 12px 11px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:15px}.deadline-head{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}.deadline-count{font-size:24px;font-weight:900;line-height:1.05;margin-bottom:9px}.deadline-count small{font-size:12px;font-weight:700;color:var(--muted)}.bar{height:15px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:#16a34a;transition:width .4s}.bar.warn>i{background:#d97706}.bar.danger>i{background:#dc2626}.bar.over>i{background:#7f1d1d}.deadline-scale{display:flex;justify-content:space-between;font-size:10px;color:#9ca3af;margin-top:6px}.deadline-percent{text-align:right;font-size:11px;font-weight:800;margin-top:5px;color:#6b7280}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.calendar-nav{display:flex;gap:6px}.calendar-nav button{padding:8px 11px}.calendar-title{font-size:17px;font-weight:800}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-weekday{text-align:center;font-size:10px;font-weight:800;color:#9ca3af;padding:4px 0}.cal-day{min-height:72px;background:#f8f9fa;border:1px solid #e5e7eb;border-radius:11px;padding:5px;overflow:hidden;transition:.15s;cursor:pointer}.cal-day.empty{background:transparent;border-color:transparent;cursor:default}.cal-day.today{border:2px solid #111827}.cal-day.selected{box-shadow:0 0 0 2px #2563eb inset}.cal-day.drop-target{background:#eef6ff;border-color:#2563eb;transform:scale(1.02)}.cal-num{font-size:11px;font-weight:800;color:#6b7280;margin-bottom:3px}.cal-task{display:block;background:#111827;color:#fff;border-radius:6px;padding:3px 4px;margin:2px 0;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}.cal-task.done{opacity:.45;text-decoration:line-through}.unscheduled{display:flex;gap:7px;overflow:auto;padding:4px 1px 8px}.task-chip{flex:0 0 auto;background:#eef0f3;color:#111827;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;cursor:grab;border:1px solid #dfe3e8;touch-action:pan-y}.calendar-help{font-size:12px;color:var(--muted);margin-top:8px}.touch-ghost{position:fixed;z-index:9999;pointer-events:none;background:#111827;color:#fff;padding:9px 12px;border-radius:10px;font-size:12px;font-weight:700;box-shadow:0 8px 25px #0004;transform:translate(-50%,-50%)}.day-view{margin-top:14px;padding:14px;background:#f8f9fa;border:1px solid #e5e7eb;border-radius:15px}.day-view-head{display:flex;justify-content:space-between}.day-view-title{font-size:16px;font-weight:800}.day-view-stats{font-size:11px;color:var(--muted);margin-top:3px}.day-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #e5e7eb}.day-item:first-child{margin-top:10px}.check-mini{width:20px;height:20px;border:2px solid #cbd0d8;border-radius:50%;flex:none;background:#fff;padding:0}.day-item.done .check-mini{background:#111827;border-color:#111827}.day-item.done .day-item-title{text-decoration:line-through;color:#9ca3af}.day-item-title{font-weight:700;font-size:14px}.day-item-meta{font-size:11px;color:var(--muted);margin-top:2px}.day-empty{text-align:center;padding:16px 4px;color:var(--muted);font-size:13px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.show{display:flex}.sheet{width:min(720px,100%);background:#fff;border-radius:22px;padding:18px;max-height:90vh;overflow:auto}@media(min-width:700px){.modal{align-items:center}.sheet{max-height:80vh}}
</style></head><body><div class="app">
<header><div><h1>Meine Aufgaben</h1><div class="sub" id="date"></div></div><button onclick="openModal()">＋ Aufgabe</button></header>
<div class="card"><h2>Dein Überblick</h2><div class="stats"><div class="stat"><b id="openCount">0</b><span>offen</span></div><div class="stat"><b id="urgentCount">0</b><span>dringend</span></div><div class="stat"><b id="timeCount">0</b><span>Min. offen</span></div></div></div>
<div class="card"><div class="calendar-head"><div class="calendar-title" id="calendarTitle"></div><div class="calendar-nav"><button class="secondary" onclick="changeMonth(-1)">‹</button><button class="secondary" onclick="changeMonth(1)">›</button></div></div><div id="calendarGrid"></div><div class="calendar-help">Tippe auf einen Tag für die Tagesansicht. Auf dem Handy eine Aufgabe ca. 0,5 Sekunden gedrückt halten, dann auf einen Tag ziehen.</div><div id="unscheduledWrap"></div><div id="dayView"></div></div>
<div class="card"><h2>Was passt jetzt?</h2><div class="sub">Sag mir, wie viel Zeit du gerade hast.</div><div class="row"><input id="minutes" type="number" min="5" step="5" placeholder="z. B. 45"><button onclick="suggest()">Vorschlag</button></div><div id="suggestion"></div></div>
<div class="tabs"><button class="tab active" onclick="setFilter('all',this)">Alle</button><button class="tab" onclick="setFilter('today',this)">Heute</button><button class="tab" onclick="setFilter('urgent',this)">Dringend</button><button class="tab" onclick="setFilter('open',this)">Offen</button></div><div class="card"><div id="tasks"></div></div></div>
<div class="modal" id="deleteModal"><div class="sheet"><h2>Aufgabe wirklich löschen?</h2><div class="sub" id="deleteQuestion"></div><div class="row"><button class="secondary" onclick="closeDeleteModal()">Abbrechen</button><button onclick="confirmDelete()">Löschen</button></div></div></div>
<div class="modal" id="modal"><div class="sheet"><h2>Aufgabe hinzufügen</h2><label>Was musst du erledigen?</label><input id="fTitle" placeholder="z. B. Staubsaugen"><div class="grid"><div><label>Priorität</label><select id="fPriority"><option value="A">A – wichtig & dringend</option><option value="B" selected>B – wichtig</option><option value="C">C – kann warten</option></select></div><div><label>Dauer (Minuten)</label><input id="fDuration" type="number" min="5" value="30"></div><div><label>Erledigen am</label><input id="fPlanned" type="date"></div><div><label>Frist</label><input id="fDue" type="date"></div><div><label>Kategorie</label><select id="fCategory"><option>Privat</option><option>Haushalt</option><option>Arbeit</option><option>Finanzen</option><option>Termine</option><option>Sonstiges</option></select></div></div><div class="row"><button class="secondary" onclick="closeModal()">Abbrechen</button><button onclick="saveTask()">Speichern</button></div></div></div>
<script>
const KEY='mein-aufgabenplaner-v1';let tasks=JSON.parse(localStorage.getItem(KEY)||'[]'),filter='all';let calendarDate=new Date();calendarDate.setDate(1);let selectedDate=new Date();selectedDate.setHours(0,0,0,0);let touch={pending:null,active:false,startX:0,startY:0,lastX:0,lastY:0,timer:null,ghost:null};const today=new Date();today.setHours(0,0,0,0);document.getElementById('date').textContent=today.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long'});
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}function toISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function daysUntil(d){if(!d)return 9999;return Math.ceil((new Date(d+'T23:59:59')-today)/86400000)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function dueText(t){if(!t.due)return'Keine Frist';let d=daysUntil(t.due);if(d<0)return'Überfällig';if(d===0)return'Heute';if(d===1)return'Morgen';return'bis '+new Date(t.due+'T12:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}function urgent(t){return!t.done&&(t.priority==='A'||daysUntil(t.due)<=1)}
function deadlineHTML(t){if(!t.due)return'';let due=new Date(t.due+'T23:59:59'),start=t.createdAt?new Date(t.createdAt):new Date(today.getTime()-86400000),total=Math.max(1,due-start),pct=Math.min(100,Math.max(0,(Date.now()-start)/total*100)),days=daysUntil(t.due),cls=days<0?'over':days<=1?'danger':days<=3?'warn':'',label=days<0?Math.abs(days)+' Tag'+(Math.abs(days)==1?'':'e')+' überfällig':days===0?'HEUTE FÄLLIG':days===1?'NOCH 1 TAG':'NOCH '+days+' TAGE';return`<div class="deadline"><div class="deadline-head"><span>${days<0?'Frist überschritten':days===0?'Heute ist die Deadline':days===1?'Morgen ist die Deadline':'Bis zur Deadline'}</span><span>${Math.round(pct)} % verstrichen</span></div><div class="deadline-count">${label} <small>· ${new Date(t.due+'T12:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}</small></div><div class="bar ${cls}"><i style="width:${pct}%"></i></div><div class="deadline-percent">${Math.round(pct)} % der verfügbaren Zeit sind vorbei</div><div class="deadline-scale"><span>Start</span><span>Heute</span><span>Deadline</span></div></div>`}
function isoDate(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}function renderCalendar(){let y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate();document.getElementById('calendarTitle').textContent=calendarDate.toLocaleDateString('de-DE',{month:'long',year:'numeric'});let h='<div class="calendar-grid">';['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(x=>h+='<div class="cal-weekday">'+x+'</div>');for(let i=0;i<start;i++)h+='<div class="cal-day empty"></div>';for(let d=1;d<=last;d++){let iso=isoDate(y,m,d),dt=new Date(y,m,d),sel=iso===toISO(selectedDate),dayTasks=tasks.filter(t=>t.planned===iso);h+=`<div class="cal-day ${dt.getTime()===today.getTime()?'today ':''}${sel?'selected ':''}" data-date="${iso}" onclick="selectDay('${iso}')" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropTask(event,'${iso}')" ontouchmove="touchCalendarMove(event)" ontouchend="touchCalendarDrop(event,'${iso}')"><div class="cal-num">${d}</div>`;dayTasks.forEach(t=>h+=`<div class="cal-task ${t.done?'done':''}" draggable="true" ondragstart="dragStart(event,'${t.id}')">${esc(t.title)}</div>`);h+='</div>'}document.getElementById('calendarGrid').innerHTML=h+'</div>';let uns=tasks.filter(t=>!t.planned&&!t.done);document.getElementById('unscheduledWrap').innerHTML=uns.length?'<div class="calendar-help">Noch nicht eingeplant:</div><div class="unscheduled">'+uns.map(t=>`<div class="task-chip" draggable="true" ondragstart="dragStart(event,'${t.id}')" ontouchstart="touchStart(event,'${t.id}')" ontouchmove="touchMove(event)" ontouchend="touchEnd(event)">${esc(t.title)}</div>`).join('')+'</div>':'';renderDayView()}
function selectDay(iso){selectedDate=new Date(iso+'T12:00');selectedDate.setHours(0,0,0,0);renderCalendar();setTimeout(()=>document.getElementById('dayView').scrollIntoView({behavior:'smooth',block:'nearest'}),20)}function renderDayView(){let iso=toISO(selectedDate),arr=tasks.filter(t=>t.planned===iso),done=arr.filter(t=>t.done).length,total=arr.reduce((s,t)=>s+(+t.duration||0),0),open=arr.filter(t=>!t.done).reduce((s,t)=>s+(+t.duration||0),0),h=`<div class="day-view"><div class="day-view-head"><div><div class="day-view-title">Tagesansicht · ${selectedDate.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</div><div class="day-view-stats">${arr.length} Aufgabe${arr.length===1?'':'n'} · ${done} erledigt · ${total} Min. geplant · ${open} Min. offen</div></div></div>`;if(!arr.length)h+='<div class="day-empty">Für diesen Tag sind noch keine Aufgaben eingeplant.</div>';else arr.forEach(t=>h+=`<div class="day-item ${t.done?'done':''}"><button class="check-mini" onclick="toggle('${t.id}')">${t.done?'✓':''}</button><div><div class="day-item-title">${esc(t.title)}</div><div class="day-item-meta">${esc(t.category)} · ${t.duration} Min. · Priorität ${t.priority}${t.due?' · Frist '+new Date(t.due+'T12:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}):''}</div></div></div>`);document.getElementById('dayView').innerHTML=h+'</div>'}
function changeMonth(n){calendarDate.setMonth(calendarDate.getMonth()+n);renderCalendar()}function dragStart(e,id){e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move'}function dragOver(e){e.preventDefault();e.currentTarget.classList.add('drop-target')}function dragLeave(e){e.currentTarget.classList.remove('drop-target')}function dropTask(e,date){e.preventDefault();let id=e.dataTransfer.getData('text/plain');assignPlanned(id,date);clearDrops()}function clearDrops(){document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'))}function assignPlanned(id,date){let t=tasks.find(x=>x.id===id);if(!t)return;t.planned=date;selectedDate=new Date(date+'T12:00');selectedDate.setHours(0,0,0,0);calendarDate=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);save()}
function touchStart(e,id){if(e.touches.length!==1)return;clearTouch();let p=e.touches[0];touch.pending=id;touch.startX=touch.lastX=p.clientX;touch.startY=touch.lastY=p.clientY;touch.timer=setTimeout(beginTouch,500)}function clearTouch(){if(touch.timer){clearTimeout(touch.timer);touch.timer=null}touch.pending=null}function beginTouch(){if(!touch.pending)return;touch.active=true;let t=tasks.find(x=>x.id===touch.pending);if(!t)return;touch.ghost=document.createElement('div');touch.ghost.className='touch-ghost';touch.ghost.textContent=t.title;document.body.appendChild(touch.ghost);moveGhost(touch.lastX,touch.lastY)}function moveGhost(x,y){if(touch.ghost){touch.ghost.style.left=x+'px';touch.ghost.style.top=y+'px'}}function touchMove(e){if(!touch.pending)return;let p=e.touches[0];touch.lastX=p.clientX;touch.lastY=p.clientY;if(!touch.active&&Math.hypot(p.clientX-touch.startX,p.clientY-touch.startY)>10){clearTouch();return}if(touch.active){e.preventDefault();moveGhost(p.clientX,p.clientY);touchCalendarMove(e)}}function touchCalendarMove(e){if(!touch.active||!e.touches[0])return;clearDrops();let el=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY),day=el&&el.closest('.cal-day[data-date]');if(day)day.classList.add('drop-target')}function touchCalendarDrop(e,date){if(!touch.active)return;let p=e.changedTouches&&e.changedTouches[0],el=p&&document.elementFromPoint(p.clientX,p.clientY),day=el&&el.closest('.cal-day[data-date]');if(day)assignPlanned(touch.pending,day.dataset.date);touchEnd()}function touchEnd(){if(touch.timer)clearTimeout(touch.timer);touch.timer=null;touch.pending=null;touch.active=false;if(touch.ghost){touch.ghost.remove();touch.ghost=null}clearDrops()}
function render(){let open=tasks.filter(t=>!t.done);document.getElementById('openCount').textContent=open.length;document.getElementById('urgentCount').textContent=open.filter(urgent).length;document.getElementById('timeCount').textContent=open.reduce((a,t)=>a+(+t.duration||0),0);let list=tasks.filter(t=>filter==='today'?!t.done&&daysUntil(t.due)===0:filter==='urgent'?urgent(t):filter==='open'?!t.done:true).sort((a,b)=>(a.done-b.done)||({A:0,B:1,C:2}[a.priority]-{A:0,B:1,C:2}[b.priority])||(daysUntil(a.due)-daysUntil(b.due)));document.getElementById('tasks').innerHTML=list.length?list.map(t=>`<div class="task ${t.done?'done':''}" draggable="true" ondragstart="dragStart(event,'${t.id}')" ontouchstart="touchStart(event,'${t.id}')" ontouchmove="touchMove(event)" ontouchend="touchEnd(event)"><button class="check" onclick="event.stopPropagation();toggle('${t.id}')">${t.done?'✓':''}</button><div style="flex:1"><div class="title">${esc(t.title)}</div><div class="meta"><span class="pill ${t.priority}">${t.priority}</span>${esc(t.category)} · ${t.duration} Min. · ${dueText(t)}${t.planned?' · geplant '+new Date(t.planned+'T12:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}):''}</div>${deadlineHTML(t)}</div><div class="actions"><button class="icon" onclick="event.stopPropagation();requestDelete('${t.id}')">×</button></div></div>`).join(''):'<div class="empty">Noch keine Aufgaben. Füge deine erste Aufgabe hinzu.</div>';renderCalendar()}
function toggle(id){let t=tasks.find(x=>x.id===id);if(t){t.done=!t.done;save()}}let pendingDeleteId=null;function requestDelete(id){let t=tasks.find(x=>x.id===id);if(!t)return;pendingDeleteId=id;document.getElementById('deleteQuestion').textContent='„'+t.title+'“ wird dauerhaft entfernt. Bist du sicher?';document.getElementById('deleteModal').classList.add('show')}function closeDeleteModal(){pendingDeleteId=null;document.getElementById('deleteModal').classList.remove('show')}function confirmDelete(){let t=tasks.find(x=>x.id===pendingDeleteId);if(!t)return;if(!confirm('Wirklich endgültig löschen?\n\n„'+t.title+'“ wird dauerhaft entfernt.'))return;tasks=tasks.filter(x=>x.id!==pendingDeleteId);closeDeleteModal();save()}
function openModal(){document.getElementById('modal').classList.add('show');document.getElementById('fTitle').focus()}function closeModal(){document.getElementById('modal').classList.remove('show')}function saveTask(){let title=document.getElementById('fTitle').value.trim();if(!title)return alert('Bitte eine Aufgabe eingeben.');tasks.push({id:Date.now().toString(),title,priority:document.getElementById('fPriority').value,duration:+document.getElementById('fDuration').value||30,planned:document.getElementById('fPlanned').value,due:document.getElementById('fDue').value,category:document.getElementById('fCategory').value,done:false,createdAt:new Date().toISOString()});save();closeModal();document.getElementById('fTitle').value=''}function setFilter(f,b){filter=f;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function suggest(){let mins=+document.getElementById('minutes').value;if(!mins)return;let candidates=tasks.filter(t=>!t.done).sort((a,b)=>(urgent(b)-urgent(a))||({A:0,B:1,C:2}[a.priority]-{A:0,B:1,C:2}[b.priority])||(daysUntil(a.due)-daysUntil(b.due))),picked=[],sum=0;for(let t of candidates){if(sum+t.duration<=mins){picked.push(t);sum+=+t.duration}}document.getElementById('suggestion').innerHTML=picked.length?`<div style="margin-top:14px"><b>Das würde jetzt gut passen:</b><ol>${picked.map(t=>`<li style="margin:8px 0">${esc(t.title)} <span class="meta">(${t.duration} Min., ${dueText(t)})</span></li>`).join('')}</ol><div class="sub">Geplant: ${sum} von ${mins} Minuten.</div></div>`:`<div class="sub" style="margin-top:12px">Keine Kombination passt in ${mins} Minuten.</div>`}render();
</script></body></html>
