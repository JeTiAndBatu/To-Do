<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172033"><title>Mein Plan</title>
<style>
:root{--ink:#172033;--muted:#71809a;--line:#e5eaf1;--blue:#2563eb;--soft:#eff6ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#edf4ff,#f7f8fc 320px);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:880px;margin:auto;padding:25px 16px 48px}header,.head{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:31px;letter-spacing:-.05em;margin:0}h2{font-size:18px;margin:0;letter-spacing:-.02em}.sub,.meta{font-size:13px;color:var(--muted);margin-top:4px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 28px #1720330a}button{border:0;border-radius:12px;padding:10px 13px;font-weight:750;cursor:pointer}.primary{color:#fff;background:linear-gradient(135deg,#2563eb,#4f46e5);box-shadow:0 7px 18px #2563eb35}.ghost{background:#eff2f7;color:#46546b}.nav,.filters{display:flex;gap:5px;padding:4px;background:#e8edf5;border-radius:15px;overflow:auto}.nav{margin-bottom:14px}.nav button,.filters button{background:transparent;color:#5c6a82;white-space:nowrap}.nav button.active,.filters button.active{background:#fff;color:#1d4ed8;box-shadow:0 2px 8px #17203316}.view{display:none}.view.active{display:block}.quick{display:grid;grid-template-columns:1fr auto;gap:8px}input,select,textarea{width:100%;border:1px solid #d9e2ed;border-radius:12px;padding:11px;background:#fff;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:3px solid #bfdbfe;border-color:#60a5fa}.focus{background:linear-gradient(135deg,#eaf3ff,#f4f0ff);border-color:#d4e4ff}.focus-title{font-size:21px;font-weight:850;letter-spacing:-.03em;margin-top:5px}.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:800}.A{background:#fee2e2;color:#b91c1c}.B{background:#fef3c7;color:#92400e}.C{background:#dcfce7;color:#166534}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8faff;border:1px solid #e5edf8;border-radius:15px;padding:11px}.stat b{display:block;font-size:22px;color:#1d4ed8}.stat span{font-size:12px;color:var(--muted);font-weight:700}.task{display:flex;gap:11px;padding:13px 1px;border-bottom:1px solid #edf0f5;align-items:flex-start}.task:last-child{border:0}.check{width:22px;height:22px;border-radius:50%;border:2px solid #bdc9d8;background:#fff;flex:none;padding:0}.task.done{opacity:.5}.task.done .name{text-decoration:line-through}.task.done .check{background:var(--blue);border-color:var(--blue);color:#fff}.body{flex:1;min-width:0}.name{font-weight:800}.meta{line-height:1.6}.task button.edit{background:#f0f3f7;color:#5b687e;padding:6px 8px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}.day{min-height:105px;border:1px solid var(--line);border-radius:14px;padding:7px;background:#fbfcfe;cursor:pointer}.day.today{border:2px solid var(--blue);background:#f2f7ff}.day.selected{box-shadow:0 0 0 2px #a5c9ff inset}.day small{color:var(--muted);font-weight:700}.day b{display:block;font-size:17px;margin:3px 0}.dot{height:6px;background:#5b8df5;border-radius:4px;margin:3px 0}.inbox{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.inbox:last-child{border:0}.inbox button{background:var(--soft);color:#1d4ed8;padding:7px 9px}.empty{text-align:center;padding:23px;color:var(--muted);font-size:13px}.modal{display:none;position:fixed;inset:0;background:#17203377;padding:12px;z-index:5;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(650px,100%);margin:auto;background:#fff;border-radius:24px;padding:18px;max-height:90vh;overflow:auto}.sheet label{display:block;font-size:12px;font-weight:750;color:#5d6a81;margin:10px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.footer{display:flex;gap:8px;margin-top:16px}.footer button{flex:1}@media(max-width:560px){.quick{grid-template-columns:1fr}.day{min-height:82px;padding:5px}.day small{font-size:9px}.day b{font-size:14px}.grid{grid-template-columns:1fr}.task .edit{display:none}}
</style></head><body><main class="app">
<header><div><h1>Mein Plan</h1><div class="sub" id="date"></div></div><button class="primary" onclick="openEdit()">＋ Aufgabe</button></header>
<nav class="nav"><button class="active" onclick="view('today',this)">Heute</button><button onclick="view('plan',this)">Planen</button><button onclick="view('all',this)">Alle Aufgaben</button></nav>
<section class="view active" id="today"><div class="quick"><input id="quick" placeholder="Was möchtest du erledigen?" onkeydown="if(event.key==='Enter')quickAdd()"><button class="primary" onclick="quickAdd()">Hinzufügen</button></div><div class="card focus" id="focus"></div><div class="stats"><div class="stat"><b id="openN">0</b><span>heute offen</span></div><div class="stat"><b id="minutesN">0</b><span>Minuten geplant</span></div><div class="stat"><b id="inboxN">0</b><span>ungeplant</span></div></div><div class="head" style="margin-top:20px"><h2>Heute</h2><button class="ghost" onclick="view('plan',document.querySelectorAll('.nav button')[1])">Plan ändern</button></div><div id="todayList"></div></section>
<section class="view" id="plan"><div class="card"><div class="head"><h2>Woche planen</h2><span><button class="ghost" onclick="week(-1)">‹</button><button class="ghost" onclick="week(1)">›</button></span></div><div class="week" id="week"></div><div class="sub">Wähle einen Tag und plane Aufgaben aus deiner Inbox ein.</div></div><div class="card"><div class="head"><h2 id="selectedTitle"></h2><button class="primary" onclick="openEdit(selected)">＋ Aufgabe</button></div><div id="selectedList"></div></div><div class="card"><h2>Inbox · ungeplant</h2><div class="sub">Erst erfassen, später bewusst planen.</div><div id="inbox"></div></div></section>
<section class="view" id="all"><div class="filters"><button class="active" onclick="setFilter('open',this)">Offen</button><button onclick="setFilter('all',this)">Alle</button><button onclick="setFilter('A',this)">Priorität A</button><button onclick="setFilter('overdue',this)">Überfällig</button><button onclick="setFilter('done',this)">Erledigt</button></div><div class="card"><div class="head"><h2>Aufgaben</h2><select id="sort" onchange="render()"><option value="smart">Priorität & Frist</option><option value="planned">Planung</option><option value="duration">Dauer</option></select></div><div id="allList"></div></div></section>
</main><div class="modal" id="modal"><div class="sheet"><h2 id="editTitle">Aufgabe hinzufügen</h2><label>Aufgabe</label><input id="title"><label>Notizen</label><textarea id="notes" rows="3"></textarea><div class="grid"><div><label>Priorität</label><select id="priority"><option value="A">A – wichtig & dringend</option><option value="B">B – wichtig</option><option value="C">C – kann warten</option></select></div><div><label>Dauer (Minuten)</label><input id="duration" type="number" min="5"></div><div><label>Einplanen für</label><input id="planned" type="date"></div><div><label>Uhrzeit</label><input id="time" type="time"></div><div><label>Frist</label><input id="due" type="date"></div><div><label>Bereich</label><select id="category"><option>Privat</option><option>Arbeit</option><option>Haushalt</option><option>Finanzen</option><option>Termine</option><option>Sonstiges</option></select></div></div><div class="footer"><button class="ghost" onclick="closeEdit()">Abbrechen</button><button class="primary" onclick="saveEdit()">Speichern</button></div></div></div>
<script>
const KEY='mein-aufgabenplaner-v1',P={A:0,B:1,C:2};let filter='open',editing=null,weekStart=monday(today()),selected=iso(today());
function today(){let d=new Date();d.setHours(0,0,0,0);return d}function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function date(s){return s?new Date(s+'T12:00:00'):null}function monday(d){let x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}function esc(s){return String(s||'').replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]})}function left(s){return s?Math.round((date(s)-date(iso(today())))/86400000):9999}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}let tasks=load().map(function(t){t.id=String(t.id||Date.now()+Math.random());t.done=!!t.done;return t});function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function view(id,b){document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active')});document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');render()}function meta(t){let x=[(t.duration||0)+' Min.',t.category||'Sonstiges'];if(t.planned)x.push('geplant '+date(t.planned).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}));if(t.time)x.push(t.time);if(t.due)x.push(left(t.due)<0?'überfällig':left(t.due)===0?'heute fällig':'Frist '+date(t.due).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}));return x.join(' · ')}
function row(t){return '<div class="task '+(t.done?'done':'')+'"><button class="check" onclick="toggle(\''+t.id+'\')">'+(t.done?'✓':'')+'</button><div class="body"><div class="name">'+esc(t.title)+'</div><div class="meta"><span class="badge '+t.priority+'">'+t.priority+'</span> '+meta(t)+(t.notes?' · Notiz':'')+'</div></div><button class="edit" onclick="openEdit(null,\''+t.id+'\')">⋯</button></div>'}
function sort(a,b){let m=document.getElementById('sort')?.value||'smart';if(m==='duration')return(+a.duration||0)-(+b.duration||0);if(m==='planned')return(a.planned||'9999').localeCompare(b.planned||'9999')||(a.time||'99:99').localeCompare(b.time||'99:99');return P[a.priority]-P[b.priority]||left(a.due)-left(b.due)||left(a.planned)-left(b.planned)}
function render(){let open=tasks.filter(function(t){return!t.done}),tod=open.filter(function(t){return t.planned===iso(today())}),inbox=open.filter(function(t){return!t.planned});document.getElementById('date').textContent=today().toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long'});document.getElementById('openN').textContent=tod.length;document.getElementById('minutesN').textContent=tod.reduce(function(n,t){return n+(+t.duration||0)},0);document.getElementById('inboxN').textContent=inbox.length;let next=open.slice().sort(sort)[0];document.getElementById('focus').innerHTML=next?'<div class="sub">DEIN NÄCHSTER FOKUS</div><div class="head"><div><div class="focus-title">'+esc(next.title)+'</div><div class="meta"><span class="badge '+next.priority+'">'+next.priority+'</span> '+meta(next)+'</div></div><button class="primary" onclick="toggle(\''+next.id+'\')">Erledigt</button></div>':'<div class="focus-title">Alles erledigt – gut gemacht.</div><div class="sub">Plane etwas Neues oder genieße den freien Kopf.</div>';document.getElementById('todayList').innerHTML=tod.length?tod.sort(sort).map(row).join(''):'<div class="empty">Noch nichts für heute eingeplant.</div>';renderWeek();let st=tasks.filter(function(t){return t.planned===selected});document.getElementById('selectedTitle').textContent=date(selected).toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long'});document.getElementById('selectedList').innerHTML=st.length?st.sort(sort).map(row).join(''):'<div class="empty">Keine Aufgaben geplant.</div>';document.getElementById('inbox').innerHTML=inbox.length?inbox.sort(sort).map(function(t){return '<div class="inbox"><div><b>'+esc(t.title)+'</b><div class="meta">'+(t.duration||0)+' Min. · Priorität '+t.priority+'</div></div><button onclick="plan(\''+t.id+'\')">Einplanen</button></div>'}).join(''):'<div class="empty">Deine Inbox ist leer.</div>';let all=tasks.filter(function(t){return filter==='open'?!t.done:filter==='A'?!t.done&&t.priority==='A':filter==='overdue'?!t.done&&left(t.due)<0:filter==='done'?t.done:true});document.getElementById('allList').innerHTML=all.length?all.sort(sort).map(row).join(''):'<div class="empty">Keine passenden Aufgaben.</div>'}
function renderWeek(){let h='';for(let i=0;i<7;i++){let d=new Date(weekStart);d.setDate(d.getDate()+i);let id=iso(d),n=tasks.filter(function(t){return t.planned===id&&!t.done}).length;h+='<div class="day '+(id===iso(today())?'today ':'')+(id===selected?'selected':'')+'" onclick="pick(\''+id+'\')"><small>'+d.toLocaleDateString('de-DE',{weekday:'short'})+'</small><b>'+d.getDate()+'</b>'+Array(Math.min(n,4)).fill('<div class="dot"></div>').join('')+(n>4?'<small>+'+(n-4)+'</small>':'')+'</div>'}document.getElementById('week').innerHTML=h}
function toggle(id){let t=tasks.find(function(x){return x.id===id});if(t){t.done=!t.done;save()}}function pick(id){selected=id;render()}function week(n){weekStart.setDate(weekStart.getDate()+7*n);render()}function plan(id){let t=tasks.find(function(x){return x.id===id});if(t){t.planned=selected;save()}}function setFilter(x,b){filter=x;document.querySelectorAll('.filters button').forEach(function(v){v.classList.remove('active')});b.classList.add('active');render()}
function quickAdd(){let title=document.getElementById('quick').value.trim();if(!title)return;tasks.push({id:String(Date.now()+Math.random()),title:title,notes:'',priority:'B',duration:30,planned:'',time:'',due:'',category:'Privat',done:false});document.getElementById('quick').value='';save()}function openEdit(day,id){editing=id||null;let t=id?tasks.find(function(x){return x.id===id}):null;document.getElementById('editTitle').textContent=t?'Aufgabe bearbeiten':'Aufgabe hinzufügen';['title','notes','priority','duration','planned','time','due','category'].forEach(function(k){document.getElementById(k).value=t?.[k]??({priority:'B',duration:30,planned:day||'',category:'Privat'}[k]||'')});document.getElementById('modal').classList.add('show')}function closeEdit(){document.getElementById('modal').classList.remove('show')}function saveEdit(){let title=document.getElementById('title').value.trim();if(!title)return;let d={title:title,notes:document.getElementById('notes').value.trim(),priority:document.getElementById('priority').value,duration:Math.max(5,+document.getElementById('duration').value||30),planned:document.getElementById('planned').value,time:document.getElementById('time').value,due:document.getElementById('due').value,category:document.getElementById('category').value};if(editing)Object.assign(tasks.find(function(t){return t.id===editing}),d);else{d.id=String(Date.now()+Math.random());d.done=false;tasks.push(d)}closeEdit();save()}render();
</script></body></html>
