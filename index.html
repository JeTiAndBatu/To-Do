<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Mein Aufgabenplaner</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--red:#dc2626;--orange:#d97706;--green:#16a34a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}
.app{max-width:720px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:29px;margin:0}h2{font-size:19px;margin:0 0 12px}.sub{color:var(--muted);font-size:14px;margin-top:3px}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;background:var(--accent);color:white}button.secondary{background:#eef0f3;color:#111827}
button:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000008}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8f9fa;border-radius:14px;padding:12px}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tab{white-space:nowrap;background:#fff;color:#374151;border:1px solid var(--line)}.tab.active{background:#111827;color:#fff}
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.check{width:22px;height:22px;border:2px solid #cbd0d8;border-radius:50%;padding:0;background:white;flex:none}.done .check{background:#111827;border-color:#111827;color:white}.done .title{text-decoration:line-through;color:#9ca3af}
.title{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:5px}.pill{display:inline-block;padding:3px 7px;border-radius:8px;font-size:11px;font-weight:800;margin-right:5px}.A{background:#fee2e2;color:#b91c1c}.B{background:#fef3c7;color:#92400e}.C{background:#dcfce7;color:#166534}
.actions{margin-left:auto;display:flex;gap:5px}.icon{background:#f3f4f6;color:#374151;padding:7px 9px}
input,select{width:100%;padding:12px;border:1px solid #d7dbe1;border-radius:11px;font-size:15px;background:white}label{display:block;font-size:12px;font-weight:700;color:#4b5563;margin:10px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
.empty{text-align:center;color:var(--muted);padding:25px 10px}
.deadline{margin-top:12px;padding:13px 12px 11px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:15px}.deadline-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-bottom:8px}.deadline-head b{font-size:15px;color:#111827}.deadline-count{font-size:24px;font-weight:900;line-height:1.05;margin-bottom:9px}.deadline-count small{font-size:12px;font-weight:700;color:var(--muted)}
.bar{height:15px;background:#e5e7eb;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px #00000012}.bar>i{display:block;height:100%;border-radius:99px;background:#16a34a;transition:width .4s}.bar.warn>i{background:#d97706}.bar.danger>i{background:#dc2626}.bar.over>i{background:#7f1d1d}
.deadline-scale{display:flex;justify-content:space-between;font-size:10px;color:#9ca3af;margin-top:6px}.deadline-percent{text-align:right;font-size:11px;font-weight:800;margin-top:5px;color:#6b7280}

.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.show{display:flex}.sheet{width:min(720px,100%);background:white;border-radius:22px;padding:18px;max-height:90vh;overflow:auto}.row{display:flex;gap:8px;margin-top:14px}.row>*{flex:1}
@media(min-width:700px){.modal{align-items:center}.sheet{max-height:80vh}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Meine Aufgaben</h1><div class="sub" id="date"></div></div><button onclick="openModal()">＋ Aufgabe</button></header>

<div class="card">
<h2>Dein Überblick</h2>
<div class="stats"><div class="stat"><b id="openCount">0</b><span>offen</span></div><div class="stat"><b id="urgentCount">0</b><span>dringend</span></div><div class="stat"><b id="timeCount">0</b><span>Min. offen</span></div></div>
</div>

<div class="card">
<h2>Was passt jetzt?</h2>
<div class="sub">Sag mir, wie viel Zeit du gerade hast.</div>
<div class="row"><input id="minutes" type="number" min="5" step="5" placeholder="z. B. 45"><button onclick="suggest()">Vorschlag</button></div>
<div id="suggestion"></div>
</div>

<div class="tabs">
<button class="tab active" onclick="setFilter('all',this)">Alle</button>
<button class="tab" onclick="setFilter('today',this)">Heute</button>
<button class="tab" onclick="setFilter('urgent',this)">Dringend</button>
<button class="tab" onclick="setFilter('open',this)">Offen</button>
</div>

<div class="card"><div id="tasks"></div></div>
</div>


<div class="modal" id="deleteModal">
<div class="sheet">
<h2>Aufgabe wirklich löschen?</h2>
<div class="sub" id="deleteQuestion">Diese Aufgabe wird dauerhaft entfernt.</div>
<label>Zur Bestätigung den Aufgabentitel eingeben:</label>
<input id="deleteConfirmText" autocomplete="off" placeholder="Aufgabentitel eingeben">
<div class="row"><button class="secondary" onclick="closeDeleteModal()">Abbrechen</button><button id="deleteFinal" disabled onclick="confirmDelete()">Endgültig löschen</button></div>
</div>
</div>

<div class="modal" id="modal">
<div class="sheet">
<h2>Aufgabe hinzufügen</h2>
<label>Was musst du erledigen?</label><input id="fTitle" placeholder="z. B. Staubsaugen">
<div class="grid">
<div><label>Priorität</label><select id="fPriority"><option value="A">A – wichtig & dringend</option><option value="B" selected>B – wichtig</option><option value="C">C – kann warten</option></select></div>
<div><label>Dauer (Minuten)</label><input id="fDuration" type="number" min="5" value="30"></div>
<div><label>Frist</label><input id="fDue" type="date"></div>
<div><label>Kategorie</label><select id="fCategory"><option>Privat</option><option>Haushalt</option><option>Arbeit</option><option>Finanzen</option><option>Termine</option><option>Sonstiges</option></select></div>
</div>
<div class="row"><button class="secondary" onclick="closeModal()">Abbrechen</button><button onclick="saveTask()">Speichern</button></div>
</div>
</div>

<script>
const KEY='mein-aufgabenplaner-v1';
let tasks=JSON.parse(localStorage.getItem(KEY)||'[]'), filter='all';
const today=new Date(); today.setHours(0,0,0,0);
document.getElementById('date').textContent=today.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long'});
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function daysUntil(d){if(!d)return 9999;return Math.ceil((new Date(d+'T23:59:59')-today)/86400000)}
function dueText(t){if(!t.due)return 'Keine Frist';let d=daysUntil(t.due);if(d<0)return 'Überfällig';if(d===0)return 'Heute';if(d===1)return 'Morgen';return 'bis '+new Date(t.due+'T12:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}
function urgent(t){return !t.done && (t.priority==='A'||daysUntil(t.due)<=1)}
function deadlineHTML(t){
 if(!t.due) return '';
 const due=new Date(t.due+'T23:59:59');
 const start=t.createdAt?new Date(t.createdAt):new Date(today.getTime()-Math.max(1,Math.abs(daysUntil(t.due))+1)*86400000);
 const total=Math.max(1,due-start);
 const elapsed=Math.max(0,Date.now()-start);
 let pct=Math.min(100,Math.max(0,elapsed/total*100));
 const days=daysUntil(t.due);
 let cls=days<0?'over':days<=1?'danger':days<=3?'warn':'';
 let label=days<0?Math.abs(days)+' Tag'+(Math.abs(days)==1?'':'e')+' überfällig':days===0?'HEUTE FÄLLIG':days===1?'NOCH 1 TAG':'NOCH '+days+' TAGE';
 let exact=days<0?'Frist überschritten':days===0?'Heute ist die Deadline':days===1?'Morgen ist die Deadline':'Bis zur Deadline';
 return `<div class="deadline">
   <div class="deadline-head"><span>${exact}</span><span>${Math.round(pct)} % verstrichen</span></div>
   <div class="deadline-count">${label} <small>· ${new Date(t.due+'T12:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}</small></div>
   <div class="bar ${cls}"><i style="width:${pct}%"></i></div>
   <div class="deadline-percent">${Math.round(pct)} % der verfügbaren Zeit sind vorbei</div>
   <div class="deadline-scale"><span>Start</span><span>Heute</span><span>Deadline</span></div>
 </div>`;
}

function render(){
let open=tasks.filter(t=>!t.done);document.getElementById('openCount').textContent=open.length;document.getElementById('urgentCount').textContent=open.filter(urgent).length;document.getElementById('timeCount').textContent=open.reduce((a,t)=>a+(+t.duration||0),0);
let list=tasks.filter(t=>{if(filter==='today')return !t.done&&daysUntil(t.due)===0;if(filter==='urgent')return urgent(t);if(filter==='open')return !t.done;return true})
.sort((a,b)=>(a.done-b.done)||({A:0,B:1,C:2}[a.priority]-{A:0,B:1,C:2}[b.priority])||((daysUntil(a.due))-(daysUntil(b.due))));
let el=document.getElementById('tasks');el.innerHTML=list.length?list.map(t=>`<div class="task ${t.done?'done':''}"><button class="check" onclick="toggle('${t.id}')">${t.done?'✓':''}</button><div style="flex:1"><div class="title">${esc(t.title)}</div><div class="meta"><span class="pill ${t.priority}">${t.priority}</span>${esc(t.category)} · ${t.duration} Min. · ${dueText(t)}</div>${deadlineHTML(t)}</div><div class="actions"><button class="icon" onclick="requestDelete('${t.id}')" aria-label="Aufgabe löschen">×</button></div></div>`).join(''):'<div class="empty">Noch keine Aufgaben. Füge deine erste Aufgabe hinzu.</div>';
}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toggle(id){let t=tasks.find(x=>x.id===id);t.done=!t.done;save()}
let pendingDeleteId=null;
function requestDelete(id){
 const t=tasks.find(x=>x.id===id); if(!t)return;
 pendingDeleteId=id;
 document.getElementById('deleteQuestion').textContent='„'+t.title+'“ wird dauerhaft entfernt. Dieser Vorgang kann nicht rückgängig gemacht werden.';
 const input=document.getElementById('deleteConfirmText');
 input.value='';
 document.getElementById('deleteFinal').disabled=true;
 document.getElementById('deleteModal').classList.add('show');
 setTimeout(()=>input.focus(),100);
}
function closeDeleteModal(){pendingDeleteId=null;document.getElementById('deleteModal').classList.remove('show')}
document.addEventListener('input',e=>{
 if(e.target.id==='deleteConfirmText'){
   const t=tasks.find(x=>x.id===pendingDeleteId);
   document.getElementById('deleteFinal').disabled=!(t && e.target.value.trim()===t.title);
 }
});
function confirmDelete(){
 const t=tasks.find(x=>x.id===pendingDeleteId);
 const input=document.getElementById('deleteConfirmText');
 if(!t || input.value.trim()!==t.title)return;
 tasks=tasks.filter(x=>x.id!==pendingDeleteId);
 closeDeleteModal();
 save();
}
function openModal(){document.getElementById('modal').classList.add('show');document.getElementById('fTitle').focus()}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveTask(){let title=document.getElementById('fTitle').value.trim();if(!title)return alert('Bitte eine Aufgabe eingeben.');tasks.push({id:Date.now().toString(),title,priority:document.getElementById('fPriority').value,duration:+document.getElementById('fDuration').value||30,due:document.getElementById('fDue').value,category:document.getElementById('fCategory').value,done:false,createdAt:new Date().toISOString()});save();closeModal();document.getElementById('fTitle').value=''}
function setFilter(f,b){filter=f;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function suggest(){let mins=+document.getElementById('minutes').value;if(!mins){return}let candidates=tasks.filter(t=>!t.done).sort((a,b)=>(urgent(b)-urgent(a))||({A:0,B:1,C:2}[a.priority]-{A:0,B:1,C:2}[b.priority])||(daysUntil(a.due)-daysUntil(b.due)));let picked=[],sum=0;for(const t of candidates){if(sum+(+t.duration)<=mins){picked.push(t);sum+=+t.duration}}let s=document.getElementById('suggestion');s.innerHTML=picked.length?`<div style="margin-top:14px"><b>Das würde jetzt gut passen:</b><ol>${picked.map(t=>`<li style="margin:8px 0">${esc(t.title)} <span class="meta">(${t.duration} Min., ${dueText(t)})</span></li>`).join('')}</ol><div class="sub">Geplant: ${sum} von ${mins} Minuten.</div></div>`:`<div class="sub" style="margin-top:12px">Keine Kombination passt exakt in ${mins} Minuten. Versuche etwas mehr Zeit oder erledige eine kurze Aufgabe.</div>`}
render();
</script>
</body></html>
